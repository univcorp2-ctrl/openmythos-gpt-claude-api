[project]
name = "openmythos-gpt-claude-api"
version = "0.1.0"
description = "FastAPI bridge for using OpenMythos from GPT Actions and Claude tool use."
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
